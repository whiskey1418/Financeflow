<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#101B34" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>FinanceFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="FinanceFlow">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: none; background: #F5F7FA; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; }
  button { -webkit-user-select: none; user-select: none; }
  input, select { -webkit-user-select: text; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #root { min-height: 100vh; min-height: 100dvh; }
  #boot {
    position: fixed; inset: 0; background: #101B34; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 999; transition: opacity .4s ease;
  }
  #boot .mark {
    width: 56px; height: 56px; border-radius: 16px; background: #4FA3D1; display: flex; align-items: center;
    justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: #101B34;
  }
  #boot .label { font-family: 'Space Grotesk', sans-serif; color: white; font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  #boot .dots { display: flex; gap: 5px; }
  #boot .dots span { width: 6px; height: 6px; border-radius: 99px; background: #4FA3D1; opacity: .4; animation: pulse 1s infinite ease-in-out; }
  #boot .dots span:nth-child(2) { animation-delay: .15s; }
  #boot .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  #boot .err {
    display: none; max-width: 280px; text-align: center; color: #C7D2E0; font-family: Inter, sans-serif;
    font-size: 13px; line-height: 1.5; margin-top: 4px;
  }
  #boot .retry {
    display: none; margin-top: 6px; background: #4FA3D1; color: #101B34; border: none; border-radius: 10px;
    padding: 8px 18px; font-family: Inter, sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  #install-banner {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #101B34; color: #F5F7FA; font-family: Inter, sans-serif;
    align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #install-banner .ib-text { display: flex; flex-direction: column; line-height: 1.25; }
  #install-banner .ib-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; }
  #install-banner .ib-sub { font-size: 11px; color: #C7D2E0; }
  #install-banner .ib-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #install-banner a.ib-btn {
    background: #4FA3D1; color: #101B34; text-decoration: none; font-weight: 700; font-size: 13px;
    padding: 8px 14px; border-radius: 10px; white-space: nowrap;
  }
  #install-banner button.ib-close {
    background: transparent; border: none; color: #C7D2E0; font-size: 18px; line-height: 1;
    padding: 4px 6px; cursor: pointer;
  }
  body.has-install-banner #boot { top: 52px; height: calc(100vh - 52px); height: calc(100dvh - 52px); }
</style>
</head>
<body>
<div id="install-banner">
  <div class="ib-text">
    <span class="ib-title">Install FinanceFlow</span>
    <span class="ib-sub">Get the Android app for offline access</span>
  </div>
  <div class="ib-actions">
    <a class="ib-btn" href="FinanceFlow.apk" download="FinanceFlow.apk">Install</a>
    <button class="ib-close" id="install-banner-close" aria-label="Dismiss">&times;</button>
  </div>
</div>
<div id="boot">
  <div class="mark">F</div>
  <div class="label">FinanceFlow</div>
  <div class="dots" id="boot-dots"><span></span><span></span><span></span></div>
  <div class="err" id="boot-err">This is taking longer than expected. Something failed to load.</div>
  <button class="retry" id="boot-retry" onclick="location.reload()">Retry</button>
</div>
<div id="root"></div>

<script>
  // Safety net: if the app hasn't mounted within a few seconds, stop
  // spinning forever and tell the person something actually went wrong.
  window.__bootTimer = setTimeout(function () {
    var dots = document.getElementById("boot-dots");
    var err = document.getElementById("boot-err");
    var retry = document.getElementById("boot-retry");
    if (dots) dots.style.display = "none";
    if (err) err.style.display = "block";
    if (retry) retry.style.display = "inline-block";
  }, 6000);

  window.addEventListener("error", function (e) {
    var err = document.getElementById("boot-err");
    if (err && document.getElementById("boot")) {
      err.textContent = "Couldn't load the app (" + (e.message || "script error") + ").";
    }
  });
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
  (function () {
    var firebaseConfig = {
      apiKey: "AIzaSyAO30Ggg1C8WQRuX2YbM2DTfxC45SAd6Lc",
      authDomain: "finance-flow-14.firebaseapp.com",
      projectId: "finance-flow-14",
      storageBucket: "finance-flow-14.firebasestorage.app",
      messagingSenderId: "888262849328",
      appId: "1:888262849328:web:9f17e41c5d3aec4080cef5"
    };
    try {
      firebase.initializeApp(firebaseConfig);
      window.__ffAuth = firebase.auth();
      window.__ffDb = firebase.firestore();
      window.__ffGoogleProvider = new firebase.auth.GoogleAuthProvider();
    } catch (e) {
      console.error("Firebase failed to initialize", e);
    }
  })();
</script>
<script src="app.bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<script>
  (function () {
    var isAndroid = /Android/i.test(navigator.userAgent);
    // Already running inside the installed TWA/standalone app? Don't prompt again.
    var isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      document.referrer.indexOf("android-app://") === 0;
    var dismissed = false;
    try { dismissed = localStorage.getItem("ff-install-dismissed") === "1"; } catch (e) {}

    if (isAndroid && !isStandalone && !dismissed) {
      document.body.classList.add("has-install-banner");
      var banner = document.getElementById("install-banner");
      if (banner) banner.style.display = "flex";
    }

    var closeBtn = document.getElementById("install-banner-close");
    if (closeBtn) {
      closeBtn.addEventListener("click", function () {
        var banner = document.getElementById("install-banner");
        if (banner) banner.style.display = "none";
        document.body.classList.remove("has-install-banner");
        try { localStorage.setItem("ff-install-dismissed", "1"); } catch (e) {}
      });
    }
  })();
</script>
</body>
</html>
