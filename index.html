function useCountUp(value, duration = 900) {
  const [display, setDisplay] = useState(0);
  const startRef = useRef(null);
  const fromRef = useRef(0);
  useEffect(() => {
    fromRef.current = display;
    startRef.current = null;
    let raf;
    const step = (ts) => {
      if (!startRef.current) startRef.current = ts;
      const p = Math.min(1, (ts - startRef.current) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(fromRef.current + (value - fromRef.current) * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [value]);
  return Math.round(display);
}

function Sparkline({ data, height = 46, stroke = "#4FA3D1" }) {
  const w = 260;
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = height - ((v - min) / (max - min || 1)) * height;
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaD = `${d} L${w},${height} L0,${height} Z`;
  const gid = "sg" + Math.round(Math.random() * 1e6);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={stroke} stopOpacity="0.35" />
          <stop offset="100%" stopColor={stroke} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill={`url(#${gid})`} stroke="none" />
      <path d={d} fill="none" stroke={stroke} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3.5" fill={stroke} />
    </svg>
  );
}

function Progress({ pct, color, track = C.line, h = 8 }) {

  return (

      <div style={{ width: `${p}%`, height: "100%", background: color, borderRadius: h, transition: "width .5s cubic-bezier(.22,1,.36,1)" }} />
    </div>
  );
}

function TransactionsScreen({ tx, desktop }) {
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const filtered = tx.filter((t) => (filter === "all" || t.type === filter) && (t.note.toLowerCase().includes(q.toLowerCase()) || t.category.toLowerCase().includes(q.toLowerCase())));
  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach((t) => { (g[t.date] = g[t.date] || []).push(t); });
    return Object.entries(g).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }, [filtered]);

  return (
    <div>
      <Header title="Transactions" subtitle={`${tx.length} total entries`} />
      <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px", marginBottom: 14 }}>
        <Search size={16} color={C.faint} />
        <input
          value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search transactions"
          style={{ border: "none", outline: "none", fontFamily: "Inter, sans-serif", fontSize: 13.5, flex: 1, background: "transparent", color: C.ink }}
        />
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, overflowX: "auto" }}>
        {["all", "income", "expense", "transfer"].map((f) => (
          <button key={f} onClick={() => setFilter(f)} style={{
            fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 600, padding: "8px 14px", borderRadius: 999, whiteSpace: "nowrap",
            border: `1px solid ${filter === f ? C.navy : C.line}`, background: filter === f ? C.navy : "white", color: filter === f ? "white" : C.sub, cursor: "pointer",
          }}>{f[0].toUpperCase() + f.slice(1)}</button>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: desktop ? "repeat(2,1fr)" : "1fr", gap: "0 16px" }}>
        {grouped.map(([date, items]) => (
          <div key={date} style={{ marginBottom: 6 }}>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, fontWeight: 700, color: C.faint, textTransform: "uppercase", letterSpacing: 0.5, margin: "10px 0 8px" }}>
              {date === "2026-08-29" ? "Today" : date}
            </div>
            {items.map((t) => <TxRow key={t.id} t={t} />)}
          </div>
        ))}
        {filtered.length === 0 && <div style={{ fontFamily: "Inter, sans-serif", fontSize: 13.5, color: C.sub, gridColumn: "1/-1" }}>Nothing matches that search yet.</div>}
      </div>
    </div>
  );
}

function BudgetsScreen({ budgets, desktop }) {
  return (
    <div>
      <Header title="Budgets" subtitle="Monthly limits by category" />
      <div style={{ display: "grid", gridTemplateColumns: desktop ? "repeat(2,1fr)" : "1fr", gap: 12 }}>
        {budgets.map((b) => {
          const meta = CAT_META[b.category] || CAT_META.Other;
          const pct = (b.spent / b.amount) * 100;
          const over = b.spent > b.amount;
          const near = pct >= 85 && !over;
          const color = over ? C.red : near ? C.orange : C.sky;
          return (
            <Card key={b.id} style={{ padding: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <IconBadge Icon={meta.icon} color={meta.color} size={34} />
                <div style={{ flex: 1, fontFamily: "Inter, sans-serif", fontSize: 14, fontWeight: 600, color: C.ink }}>{b.category}</div>
                <div style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 13, color: C.sub }}>{fmt(b.spent)} / {fmt(b.amount)}</div>
              </div>
              <Progress pct={pct} color={color} />
              {(over || near) && (
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, fontFamily: "Inter, sans-serif", fontSize: 12.5, fontWeight: 600, color }}>
                  ⚠️ {over ? `${b.category} budget exceeded by ${fmt(b.spent - b.amount)}.` : `You've used ${Math.round(pct)}% of your ${b.category} budget.`}
                </div>
              )}
            </Card>
          );
        })}
        <Card style={{ padding: 18, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, border: `1.5px dashed ${C.faint}`, color: C.sub, minHeight: 60 }}>
          <Plus size={16} /> <span style={{ fontFamily: "Inter, sans-serif", fontSize: 13.5, fontWeight: 600 }}>New budget</span>
        </Card>
      </div>
    </div>
  );
}

function ReportsScreen({ tx, desktop }) {
  const [range, setRange] = useState("Monthly");
  const byCat = useMemo(() => {
    const map = {};
    tx.filter((t) => t.type === "expense").forEach((t) => (map[t.category] = (map[t.category] || 0) + t.amount));
    return Object.entries(map).map(([name, value]) => ({ name, value, color: (CAT_META[name] || CAT_META.Other).color }));
  }, [tx]);
  const weekly = [
    { d: "Mon", in: 0, out: 480 }, { d: "Tue", in: 0, out: 720 }, { d: "Wed", in: 6000, out: 300 },
    { d: "Thu", in: 0, out: 650 }, { d: "Fri", in: 0, out: 1250 }, { d: "Sat", in: 0, out: 900 }, { d: "Sun", in: 45000, out: 475 },
  ];
  const totalIncome = tx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const totalExpense = tx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);

  return (
    <div>
      <Header title="Reports" subtitle="How money moved" right={
        <div style={{ display: "flex", background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: 3 }}>
          {["Weekly", "Monthly"].map((r) => (
            <button key={r} onClick={() => setRange(r)} style={{
              fontFamily: "Inter, sans-serif", fontSize: 12, fontWeight: 600, padding: "6px 12px", borderRadius: 8, border: "none",
              background: range === r ? C.navy : "transparent", color: range === r ? "white" : C.sub, cursor: "pointer",
            }}>{r}</button>
          ))}
        </div>
      } />
      <div style={{ display: "grid", gridTemplateColumns: desktop ? "1fr 1fr" : "1fr", gap: 12 }}>
        <Card style={{ padding: 18 }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 8 }}>Income vs expenses</div>
          <div style={{ height: 200 }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={weekly}>
                <CartesianGrid vertical={false} stroke={C.line} />
                <XAxis dataKey="d" tick={{ fontFamily: "Inter, sans-serif", fontSize: 11, fill: C.sub }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontFamily: "Inter, sans-serif", fontSize: 10, fill: C.sub }} axisLine={false} tickLine={false} width={36} tickFormatter={(v)=>v>=1000?`${v/1000}k`:v} />
                <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontFamily: "Inter, sans-serif", fontSize: 12, borderRadius: 10, border: `1px solid ${C.line}` }} />
                <Bar dataKey="in" fill={C.green} radius={[4, 4, 0, 0]} name="Income" />
                <Bar dataKey="out" fill={C.sky} radius={[4, 4, 0, 0]} name="Expenses" />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
        <Card style={{ padding: 18 }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 8 }}>Expense by category</div>
          <div style={{ height: 200, display: "flex", alignItems: "center" }}>
            <ResponsiveContainer width="50%" height="100%">
              <PieChart>
                <Pie data={byCat} dataKey="value" innerRadius={45} outerRadius={70} paddingAngle={2}>
                  {byCat.map((e, i) => <Cell key={i} fill={e.color} />)}
                </Pie>
                <Tooltip formatter={(v) => fmt(v)} contentStyle={{ fontFamily: "Inter, sans-serif", fontSize: 12, borderRadius: 10, border: `1px solid ${C.line}` }} />
              </PieChart>
            </ResponsiveContainer>
            <div style={{ flex: 1, maxHeight: 200, overflowY: "auto" }}>
              {byCat.sort((a,b)=>b.value-a.value).map((e) => (
                <div key={e.name} style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: "Inter, sans-serif", fontSize: 12, color: C.ink, padding: "3px 0" }}>
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: e.color }} />
                  <span style={{ flex: 1 }}>{e.name}</span>
                  <span style={{ fontFamily: "IBM Plex Mono, monospace", color: C.sub }}>{fmt(e.value)}</span>
                </div>
              ))}
            </div>
          </div>
        </Card>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: desktop ? "repeat(4,1fr)" : "1fr 1fr", gap: 12, marginTop: 12 }}>
        {[
          { label: "Total income", v: fmt(totalIncome) },
          { label: "Total expenses", v: fmt(totalExpense) },
          { label: "Net savings", v: fmt(totalIncome - totalExpense) },
          { label: "Top category", v: byCat.sort((a,b)=>b.value-a.value)[0]?.name || "—" },
        ].map((s) => (
          <Card key={s.label} style={{ padding: 14 }}>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: C.sub }}>{s.label}</div>
            <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 16, fontWeight: 700, color: C.ink, marginTop: 4 }}>{s.v}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------- Add Transaction ---------------------------- */

function AddTransactionSheet({ wallets, onClose, onSave }) {
  const [type, setType] = useState("expense");
  const [amount, setAmount] = useState("");
  const [category, setCategory] = useState("Food");
  const [wallet, setWallet] = useState(wallets[0]?.name);
  const [toWallet, setToWallet] = useState(wallets[1]?.name || wallets[0]?.name);
  const [note, setNote] = useState("");

  const expenseCats = ["Food", "Transportation", "Bills", "Shopping", "Entertainment", "Health", "Education", "Rent", "Subscription", "Travel", "Gaming", "Other"];
  const incomeCats = ["Salary", "Freelance", "Business", "Gift", "Other"];
  const cats = type === "income" ? incomeCats : expenseCats;

  useEffect(() => { setCategory(cats[0]); }, [type]); // eslint-disable-line

  const valid = Number(amount) > 0 && (type !== "transfer" || wallet !== toWallet);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(16,27,52,0.45)", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: C.paper, width: "100%", maxWidth: 480, borderRadius: "24px 24px 0 0", padding: "10px 20px calc(24px + env(safe-area-inset-bottom))",
        maxHeight: "88vh", overflowY: "auto",
      }}>
        <div style={{ width: 40, height: 4, borderRadius: 99, background: C.line, margin: "6px auto 16px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 18, fontWeight: 700, color: C.ink }}>Add transaction</div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={20} color={C.sub} /></button>
        </div>

        <div style={{ display: "flex", background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 3, marginBottom: 18 }}>
          {["expense", "income", "transfer"].map((t) => (
            <button key={t} onClick={() => setType(t)} style={{
              flex: 1, fontFamily: "Inter, sans-serif", fontSize: 13, fontWeight: 600, padding: "9px 0", borderRadius: 9, border: "none",
              background: type === t ? (t === "income" ? C.green : t === "transfer" ? C.sky : C.navy) : "transparent",
              color: type === t ? "white" : C.sub, cursor: "pointer", textTransform: "capitalize",
            }}>{t}</button>
          ))}
        </div>

        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: C.sub, marginBottom: 6 }}>Amount</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
            <span style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 28, color: C.faint }}>₱</span>
            <input
              autoFocus inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9.]/g, ""))}
              placeholder="0"
              style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 38, fontWeight: 700, color: C.ink, border: "none", outline: "none", background: "transparent", width: 180, textAlign: "left" }}
            />
          </div>
        </div>

        {type === "transfer" ? (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <FieldSelect label="From" value={wallet} onChange={setWallet} options={wallets.map((w) => w.name)} />
            <div style={{ paddingTop: 18 }}><ArrowLeftRight size={16} color={C.faint} /></div>
            <FieldSelect label="To" value={toWallet} onChange={setToWallet} options={wallets.map((w) => w.name)} />
          </div>
        ) : (
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            <FieldSelect label="Category" value={category} onChange={setCategory} options={cats} />
            <FieldSelect label="Wallet" value={wallet} onChange={setWallet} options={wallets.map((w) => w.name)} />
          </div>
        )}

        <div style={{ marginBottom: 18 }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: C.sub, marginBottom: 6 }}>Note (optional)</div>
          <input
            value={note} onChange={(e) => setNote(e.target.value)} placeholder="What was this for?"
            style={{ width: "100%", boxSizing: "border-box", padding: "12px 14px", borderRadius: 12, border: `1px solid ${C.line}`, fontFamily: "Inter, sans-serif", fontSize: 14, outline: "none", background: "white" }}
          />
        </div>

        <button
          disabled={!valid}
          onClick={() => onSave({ type, amount: Number(amount), category: type === "transfer" ? "Transfer" : category, wallet, toWallet, note: note || (type === "transfer" ? `${wallet} → ${toWallet}` : category) })}
          style={{
            width: "100%", padding: "15px 0", borderRadius: 14, border: "none", cursor: valid ? "pointer" : "not-allowed",
            background: valid ? C.navy : C.line, color: valid ? "white" : C.faint, fontFamily: "Inter, sans-serif", fontSize: 15, fontWeight: 700,
          }}
        >
          Save transaction
        </button>
      </div>
    </div>
  );
}

function FieldSelect({ label, value, onChange, options }) {
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: C.sub, marginBottom: 6 }}>{label}</div>
      <select value={value} onChange={(e) => onChange(e.target.value)} style={{
        width: "100%", padding: "12px 10px", borderRadius: 12, border: `1px solid ${C.line}`, fontFamily: "Inter, sans-serif",
        fontSize: 13.5, color: C.ink, background: "white", outline: "none", appearance: "none",
      }}>
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}

const SIDEBAR_ITEMS = [
  { id: "home", label: "Dashboard", icon: Home },
  { id: "wallets", label: "Wallets", icon: Wallet },
  { id: "transactions", label: "Transactions", icon: ArrowLeftRight },
  { id: "budgets", label: "Budgets", icon: Target },
  { id: "goals", label: "Savings goals", icon: Sparkles },
  { id: "reports", label: "Reports", icon: PieIcon },
  { id: "settings", label: "Settings", icon: Settings },
];

function FinanceFlow() {
  const [device, setDevice] = useState(window.innerWidth >= 900 ? "desktop" : "mobile");
  const [screen, setScreen] = useState("home");
  const [wallets, setWallets] = useState(initialWallets);
  const [tx, setTx] = useState(seedTx);
  const [budgets, setBudgets] = useState(initialBudgets);
  const [goals] = useState(initialGoals);
  const [showAdd, setShowAdd] = useState(false);
  const [selectedWallet, setSelectedWallet] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const totalMoney = wallets.filter((w) => w.active).reduce((s, w) => s + w.balance, 0);
  const income = tx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const expenses = tx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);

  function handleSave(entry) {
    const wIdx = wallets.findIndex((w) => w.name === entry.wallet);
    const next = [...wallets];
    if (entry.type === "expense") {
      next[wIdx] = { ...next[wIdx], balance: next[wIdx].balance - entry.amount };
    } else if (entry.type === "income") {
      next[wIdx] = { ...next[wIdx], balance: next[wIdx].balance + entry.amount };
    } else {
      const tIdx = wallets.findIndex((w) => w.name === entry.toWallet);
      next[wIdx] = { ...next[wIdx], balance: next[wIdx].balance - entry.amount };
      next[tIdx] = { ...next[tIdx], balance: next[tIdx].balance + entry.amount };
    }
    setWallets(next);

    if (entry.type !== "transfer") {
      const budgetIdx = budgets.findIndex((b) => b.category === entry.category);
      if (budgetIdx > -1 && entry.type === "expense") {
        const nb = [...budgets];
        nb[budgetIdx] = { ...nb[budgetIdx], spent: nb[budgetIdx].spent + entry.amount };
        setBudgets(nb);
      }
    }

    setTx([{ id: "t" + Date.now(), type: entry.type, category: entry.category, wallet: entry.wallet, amount: entry.amount, note: entry.note, date: "2026-08-29", time: new Date().toTimeString().slice(0, 5) }, ...tx]);
    setShowAdd(false);
    setToast(entry.type === "transfer" ? "Transfer complete" : entry.type === "income" ? "Income added" : "Expense added");
  }

  const dailyBudget = 1000;
  const saved = income - expenses;

  const screenProps = { wallets, tx, budgets, goals, totalMoney, income, expenses, saved, dailyBudget };

  function renderScreen(desktop) {
    if (selectedWallet) return <WalletDetail wallet={selectedWallet} tx={tx} onBack={() => setSelectedWallet(null)} />;
    switch (screen) {
      case "home": return <Dashboard {...screenProps} desktop={desktop} />;
      case "wallets": return <WalletsScreen wallets={wallets} tx={tx} desktop={desktop} onSelectWallet={setSelectedWallet} />;
      case "transactions": return <TransactionsScreen tx={tx} desktop={desktop} />;
      case "budgets": return <BudgetsScreen budgets={budgets} desktop={desktop} />;
      case "goals": return <GoalsScreen goals={goals} desktop={desktop} />;
      case "reports": return <ReportsScreen tx={tx} desktop={desktop} />;
      case "settings": return (
        <div>
          <Header title="Settings" subtitle="Profile, currency, notifications" />
          <Card style={{ padding: 40, textAlign: "center", color: C.sub, fontFamily: "Inter, sans-serif", fontSize: 13.5 }}>Settings screens ship in the next milestone.</Card>
        </div>
      );
      default: return null;
    }
  }

  const DeviceToggle = (
    <div style={{ display: "flex", background: "white", border: `1px solid ${C.line}`, borderRadius: 10, padding: 3 }}>
      {["mobile", "desktop"].map((d) => (
        <button key={d} onClick={() => setDevice(d)} style={{
          fontFamily: "Inter, sans-serif", fontSize: 12, fontWeight: 600, padding: "6px 14px", borderRadius: 7, border: "none",
          background: device === d ? C.navy : "transparent", color: device === d ? "white" : C.sub, cursor: "pointer", textTransform: "capitalize",
        }}>{d}</button>
      ))}
    </div>
  );

  if (device === "desktop") {
    return (
      <div style={{ background: C.paper, minHeight: "100vh", fontFamily: "Inter, sans-serif" }}>
        <div style={{ display: "flex" }}>
          <div style={{ width: 232, background: C.navyDeep, minHeight: "100vh", padding: "24px 16px", boxSizing: "border-box", position: "sticky", top: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 10px 24px" }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: C.sky, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <TrendingUp size={16} color={C.navyDeep} strokeWidth={2.6} />
              </div>
              <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 16, fontWeight: 700, color: "white" }}>FinanceFlow</div>
            </div>
            {SIDEBAR_ITEMS.map((item) => {
              const Icon = item.icon;
              const active = screen === item.id && !selectedWallet;
              return (
                <button key={item.id} onClick={() => { setScreen(item.id); setSelectedWallet(null); }} style={{
                  width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "11px 12px", borderRadius: 10, marginBottom: 2,
                  border: "none", background: active ? "rgba(79,163,209,0.16)" : "transparent", color: active ? "white" : "#8FA0C4",
                  fontFamily: "Inter, sans-serif", fontSize: 13.5, fontWeight: 600, cursor: "pointer", textAlign: "left",
                }}>
                  <Icon size={17} color={active ? C.sky : "#8FA0C4"} /> {item.label}
                </button>
              );
            })}
            <button onClick={() => setShowAdd(true)} style={{
              width: "100%", marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 0",
              borderRadius: 12, border: "none", background: C.sky, color: C.navyDeep, fontFamily: "Inter, sans-serif", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
            }}><Plus size={16} /> Add transaction</button>
          </div>
          <div style={{ flex: 1, padding: "28px 36px", maxWidth: 1180 }}>
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>{DeviceToggle}</div>
            {renderScreen(true)}
          </div>
        </div>
        {showAdd && <AddTransactionSheet wallets={wallets} onClose={() => setShowAdd(false)} onSave={handleSave} />}
        {toast && <Toast text={toast} />}
      </div>
    );
  }

  return (
    <div style={{ background: C.paper, minHeight: "100vh", fontFamily: "Inter, sans-serif", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 430, minHeight: "100vh", background: C.paper, position: "relative", paddingBottom: "calc(88px + env(safe-area-inset-bottom))" }}>
        <div style={{ display: "flex", justifyContent: "flex-end", padding: "calc(14px + env(safe-area-inset-top)) 20px 0" }}>{DeviceToggle}</div>
        <div style={{ padding: "12px 18px 8px" }}>{renderScreen(false)}</div>

        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 430, margin: "0 auto", background: "rgba(245,247,250,0.92)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", borderTop: `1px solid ${C.line}`, padding: "10px 12px calc(12px + env(safe-area-inset-bottom))" }}>
          <div style={{ display: "flex", justifyContent: "space-around", alignItems: "center" }}>
            {NAV_ITEMS.map((item) => {
              const Icon = item.icon;
              if (item.id === "add") {
                return (
                  <button key="add" onClick={() => setShowAdd(true)} aria-label="Add transaction" style={{
                    width: 52, height: 52, borderRadius: 18, border: "none", background: C.navy, color: "white",
                    display: "flex", alignItems: "center", justifyContent: "center", marginTop: -26, boxShadow: "0 8px 18px rgba(16,27,52,0.35)", cursor: "pointer",
                  }}><Plus size={24} /></button>
                );
              }
              const active = screen === item.id && !selectedWallet;
              return (
                <button key={item.id} onClick={() => { setScreen(item.id); setSelectedWallet(null); }} style={{
                  background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", padding: "4px 10px",
                }}>
                  <Icon size={20} color={active ? C.navy : C.faint} strokeWidth={active ? 2.4 : 2} />
                  <span style={{ fontFamily: "Inter, sans-serif", fontSize: 10.5, fontWeight: 600, color: active ? C.navy : C.faint }}>{item.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
      {showAdd && <AddTransactionSheet wallets={wallets} onClose={() => setShowAdd(false)} onSave={handleSave} />}
      {toast && <Toast text={toast} />}
    </div>
  );
}

function Toast({ text }) {
  return (
    <div style={{
      position: "fixed", bottom: "calc(100px + env(safe-area-inset-bottom))", left: "50%", transform: "translateX(-50%)", background: C.navyDeep, color: "white",
      padding: "12px 20px", borderRadius: 14, fontFamily: "Inter, sans-serif", fontSize: 13.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
      boxShadow: "0 10px 30px rgba(16,27,52,0.35)", zIndex: 60, whiteSpace: "nowrap",
    }}>
      <Check size={16} color={C.green} /> {text}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<FinanceFlow />);

const boot = document.getElementById("boot");
if (boot) {
  setTimeout(() => {
    boot.style.opacity = "0";
    setTimeout(() => boot.remove(), 400);
  }, 500);
}
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
